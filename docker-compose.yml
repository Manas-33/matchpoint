# Local Postgres for development: `npm run db:up`
name: matchpoint
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: matchpoint
      POSTGRES_PASSWORD: matchpoint
      POSTGRES_DB: matchpoint
    ports:
      - "5433:5432"
    volumes:
      - matchpoint-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchpoint -d matchpoint"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  matchpoint-db:
